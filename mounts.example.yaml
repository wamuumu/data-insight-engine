volumes:

  # Development volumes
  - path: ./src
    target: /app/src
    readonly: false

  - path: ./alembic
    target: /app/alembic
    readonly: false

  # Mandatory volumes
  - path: ./logs
    target: /app/logs
    readonly: false
  
  # Optional volumes (uncomment and modify as needed)
  - path: your/data/path        # Replace with the actual path to your data on the host machine
    target: /app/data/path      # Replace with the desired path inside the container
    readonly: true              # One of: true, false. Set to true to prevent modifications to the data from within the container