volumes:
  grafana_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  dainet:
    driver: bridge

services:

  # ────────────────────────────────────────────────
  # ETL Application - Core Data Processing Engine
  # ────────────────────────────────────────────────
  app:
    image: data-insight-engine:latest
    container_name: data-insight-engine
    env_file: .env
    volumes:
      - /mnt/c/Users/CostaloM/Desktop/test:/data:ro # Mount local directory with read-only access
    ports:
      - "8000:8000" # Expose app on localhost:8000 for Prometheus scraping
    depends_on:
      postgres:
        condition: service_healthy # Wait for postgres to be ready
    networks:
      - dainet
    restart: unless-stopped
  
  # ────────────────────────────────────────────────
  # PostgreSQL - Primary Data Source and Storage
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dainet
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Postgres Exporter - Metrics for Prometheus
  # ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090" # Prometheus UI at localhost:9090
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - dainet
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Postgres Exporter - Metrics for Prometheus
  # ────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy # Wait for postgres to be ready
    networks:
      - dainet
    restart: unless-stopped
  
  # ────────────────────────────────────────────────
  # Grafana for Monitoring and Visualization
  # ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Grafana UI at localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - dainet
    restart: unless-stopped