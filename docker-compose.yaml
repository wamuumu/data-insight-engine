volumes:
  grafana_data:
    driver: local
  postgres_data:
    driver: local

networks:
  dainet:
    driver: bridge

services:
  # ────────────────────────────────────────────────
  # Data Cleaning and Processing Application
  # ────────────────────────────────────────────────
  app:
    image: data-insight-engine:latest
    container_name: data-insight-engine
    env_file: .env
    volumes:
      - ./src:/app/src # Mount source code with read-only access
      - /mnt/c/Users/CostaloM/Desktop/test:/data:ro # Mount local directory with read-only access
    depends_on:
      prefect:
        condition: service_healthy # Wait for prefect to be ready
      postgres:
        condition: service_healthy # Wait for postgres to be ready
    networks:
      - dainet
    restart: unless-stopped
  
  # ────────────────────────────────────────────────
  # PostgreSQL Database for Storing Processed Data
  # ────────────────────────────────────────────────
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dainet
    restart: unless-stopped

  # ────────────────────────────────────────────────
  # Prefect Server for Orchestration and Scheduling
  # ────────────────────────────────────────────────
  prefect:
    image: data-insight-prefect:latest
    container_name: prefect
    ports:
      - "4200:4200" # Prefect UI at localhost:4200
    environment:
      - PREFECT_TELEMETRY_ENABLED=false
      - PREFECT_UI_API_URL=http://localhost:4200/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dainet
    restart: unless-stopped
  
  # ────────────────────────────────────────────────
  # Grafana for Monitoring and Visualization
  # ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Grafana UI at localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dainet
    restart: unless-stopped